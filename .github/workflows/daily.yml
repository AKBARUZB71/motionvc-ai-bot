name: MOTIONVC Daily AI Carousel
on:
  schedule:
    # 03:00 UTC = 08:00 Asia/Tashkent (UTC+5)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Preview only, do not publish to Telegram'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: motionvc-daily
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      PREVIEW_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_only || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests==2.32.3 Pillow==11.1.0
          ffmpeg -version
      - name: Generate and publish
        run: python bot.py
      - name: Attach generated preview and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motionvc-output-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 7
